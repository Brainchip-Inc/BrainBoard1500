# Which languages the lint gate checks in this repository.
#
# Remove any language this repo already lints in its own CI. The gates never
# replace or duplicate a lint job that is already working here.
#
# Recognised values: python javascript typescript c cpp bash html css
#
# Nothing is removed: neither this fork nor Neuromorphyx/BrainBoard1500 runs any
# other CI, so no language is covered elsewhere. The languages with no files
# today stay listed so that the first file of that kind is linted the day it
# arrives.
LINT_LANGUAGES="python javascript typescript c cpp bash html css"

# The repository this one is a fork of, as owner/name on GitHub.
#
# Most of this repository is Neuromorphyx's library, examples and tools, synced
# in from upstream. That code follows Neuromorphyx's conventions, not ours, and
# it has to stay byte-identical to upstream's copy so the next sync merges
# cleanly. So both gates read upstream's branches, and:
#
#   format  skips every commit that already exists in upstream, which is what
#           lets an upstream sync pull request pass with Neuromorphyx's own
#           commit subjects in it
#   lint    skips every file whose path also exists in upstream, so only the
#           files BrainChip added are linted, and a BrainChip change to one of
#           upstream's files never demands that the whole file be reformatted
#
# Our own branches cannot answer either question: upstream's newest commits and
# files are in none of them until the sync that brings them in has merged.
#
# If upstream cannot be fetched, both gates warn and carry on as if upstream
# were empty. The files and commits BrainChip adds are checked exactly as
# before, and only a pull request carrying upstream's commits or touching
# upstream's files, such as a sync, then fails, loudly. Set this to "" to stop
# reading upstream altogether.
UPSTREAM_REPO="Neuromorphyx/BrainBoard1500"

# Paths the lint gate never looks at, as one extended regular expression matched
# against repository-relative paths, on top of the upstream paths above.
#
# A vendored file has to stay identical to the version it came from, so linting
# it would only report work nobody can do, and a gate like that gets switched
# off. What is excluded and why:
#
#   src/                    Neuromorphyx's library, the Akida engine and
#                           FlatBuffers. Already skipped as upstream paths;
#                           listed as well so it stays skipped when upstream
#                           cannot be fetched, because the few changes this fork
#                           carries there are patches to upstream's code
#   kiss_fft*.{c,h}         kissfft, vendored unmodified into the BrainChip
#                           keyword spotting demos, wherever the sketch keeps it
#
# This is a blocklist rather than an allowlist on purpose. A newly vendored tree
# that nobody remembers to add here fails loudly on the pull request that lands
# it, and the person landing it knows exactly which line to add. An allowlist
# would instead drop newly written BrainChip code out of the gate in silence,
# and nobody would ever find out.
LINT_EXCLUDE_REGEX="^src/|(^|/)_?kiss_fft[a-z_]*\.(c|h)$"

# Files the lint gate never looks at because a tool wrote them, recognised by
# their first line, as one extended regular expression.
#
# A model header from tools/export_model.py opens with "// Generated by
# tools/export_model.py - do not edit." and is a byte array tens of thousands of
# lines long. Each BrainChip demo keeps its own copy under whatever name suits
# it, so the line written into the file is a steadier signal than a file name,
# and a hand fix would be lost on the next export anyway.
LINT_GENERATED_REGEX="^// Generated by .*do not edit"
