# Lints only the files a pull request actually changed, and of those only the
# ones BrainChip owns.
#
# Each language is skipped unless it is listed in .github/ci-gates/ci-gates.conf
# and the pull request touched a file of that type, so a repo that already lints
# C in its own CI simply drops `c cpp` from that list and nothing here competes
# with it.
#
# This repository is a fork, and most of it is upstream's code, which keeps
# upstream's formatting. So before any linter sees the file list, the same
# configuration file drops three kinds of path from it, for the reasons written
# out next to each setting:
#
#   UPSTREAM_REPO         every path that also exists in the upstream repository
#   LINT_EXCLUDE_REGEX    the paths this repository vendors from third parties
#   LINT_GENERATED_REGEX  files a tool wrote, recognised by their first line
#
# Tools come from the runner image or from a pinned one-line install, never from
# a third-party action.

name: ci-gates-lint

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Read the gate configuration
        run: |
          set -euo pipefail
          conf=.github/ci-gates/ci-gates.conf
          UPSTREAM_REPO=""
          LINT_EXCLUDE_REGEX=""
          LINT_GENERATED_REGEX=""
          if [ -f "$conf" ]; then
            # shellcheck source=/dev/null
            . "$conf"
          else
            LINT_LANGUAGES="python javascript typescript c cpp bash html css"
          fi
          {
            echo "LINT_LANGUAGES=$LINT_LANGUAGES"
            echo "UPSTREAM_REPO=$UPSTREAM_REPO"
            echo "LINT_EXCLUDE_REGEX=$LINT_EXCLUDE_REGEX"
            echo "LINT_GENERATED_REGEX=$LINT_GENERATED_REGEX"
          } >> "$GITHUB_ENV"
          echo "linting: $LINT_LANGUAGES"
          echo "upstream: ${UPSTREAM_REPO:-none}"
          echo "excluding: ${LINT_EXCLUDE_REGEX:-nothing}"
          echo "generated: ${LINT_GENERATED_REGEX:-nothing}"

      - name: List the upstream paths
        run: |
          set -euo pipefail
          : > upstream-paths.txt
          if [ -z "$UPSTREAM_REPO" ]; then
            exit 0
          fi

          # Only the trees are needed, so one commit deep on every branch is
          # enough.
          if ! git fetch --no-tags --quiet --depth=1 \
            "https://github.com/$UPSTREAM_REPO.git" '+refs/heads/*:refs/upstream/*'; then
            echo "::warning::could not fetch $UPSTREAM_REPO, so its files are linted like any other"
            exit 0
          fi

          git for-each-ref --format='%(objectname)' refs/upstream/ |
            while read -r commit; do
              git -c core.quotePath=false ls-tree -r --name-only "$commit"
            done | sort -u > upstream-paths.txt
          echo "$(wc -l < upstream-paths.txt) paths exist in $UPSTREAM_REPO"

      - name: List the changed files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate \
            --jq '.[] | select(.status != "removed") | .filename' > all-changed.txt

          : > changed.txt
          : > upstream.txt
          : > excluded.txt
          : > generated.txt
          while IFS= read -r path; do
            if grep -Fxq -- "$path" upstream-paths.txt; then
              echo "$path" >> upstream.txt
            elif [ -n "$LINT_EXCLUDE_REGEX" ] && grep -Eq -- "$LINT_EXCLUDE_REGEX" <<< "$path"; then
              echo "$path" >> excluded.txt
            elif [ -n "$LINT_GENERATED_REGEX" ] && head -n 1 -- "$path" | grep -Eq -- "$LINT_GENERATED_REGEX"; then
              echo "$path" >> generated.txt
            else
              echo "$path" >> changed.txt
            fi
          done < all-changed.txt

          echo "linting these changed files:"
          sed 's/^/  /' changed.txt
          if [ -s upstream.txt ]; then
            echo "skipped, also in $UPSTREAM_REPO:"
            sed 's/^/  /' upstream.txt
          fi
          if [ -s excluded.txt ]; then
            echo "skipped, vendored third-party paths:"
            sed 's/^/  /' excluded.txt
          fi
          if [ -s generated.txt ]; then
            echo "skipped, generated by a tool:"
            sed 's/^/  /' generated.txt
          fi

      # Each step below selects its own files and exits early when there are
      # none, so an untouched language costs a couple of seconds and nothing more.

      - name: Python
        if: contains(env.LINT_LANGUAGES, 'python')
        run: |
          set -euo pipefail
          grep -E '\.py$' changed.txt > files.txt || { echo "no python changed"; exit 0; }
          pipx install ruff >/dev/null
          xargs -a files.txt ruff check
          xargs -a files.txt ruff format --check

      - name: Shell
        if: contains(env.LINT_LANGUAGES, 'bash')
        run: |
          set -euo pipefail
          grep -E '\.(sh|bash)$' changed.txt > files.txt || { echo "no shell changed"; exit 0; }
          xargs -a files.txt shellcheck

      - name: C and C++
        if: contains(env.LINT_LANGUAGES, 'c') || contains(env.LINT_LANGUAGES, 'cpp')
        env:
          # Pinned on purpose. Different clang-format majors format differently,
          # so an unpinned version turns the next GitHub runner image bump into a
          # mystery failure on code nobody touched. This matches the version
          # Brainchip-Inc/spark pins, so the two repositories agree. Bump this
          # when spark moves, after re-checking BrainChip's files against the
          # new version.
          CLANG_FORMAT_VERSION: "22.1.1"
        run: |
          set -euo pipefail
          # .ino is an Arduino sketch, which is the C++ this library mostly
          # ships. clang-format treats an unknown extension as C++, so the
          # sketches are checked against the same .clang-format as the rest.
          grep -E '\.(c|h|cc|cpp|cxx|hh|hpp|ino)$' changed.txt > files.txt || { echo "no c or c++ changed"; exit 0; }
          if [ ! -f .clang-format ]; then
            echo "::error::.clang-format is missing, so there is no agreed style to check against"
            exit 1
          fi
          python3 -m pip install --quiet "clang-format==${CLANG_FORMAT_VERSION}"
          clang-format --version
          xargs -a files.txt clang-format --dry-run --Werror

      - name: JavaScript, TypeScript, HTML and CSS
        if: contains(env.LINT_LANGUAGES, 'javascript') || contains(env.LINT_LANGUAGES, 'typescript') || contains(env.LINT_LANGUAGES, 'html') || contains(env.LINT_LANGUAGES, 'css')
        run: |
          set -euo pipefail
          grep -E '\.(js|jsx|mjs|cjs|ts|tsx|html|css|scss)$' changed.txt > files.txt || { echo "no web files changed"; exit 0; }
          xargs -a files.txt npx --yes prettier@3 --check
